upstream backend_pool {
    server back-end1:5252;
    server back-end2:5252;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://front-end:9000/;
    }
}